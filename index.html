<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>OBS Broadcast Overlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Background transparan secara default, tapi jadi gelap jika mode fullscreen */
        body { background: transparent; margin: 0; overflow: hidden; }
        body.mode-fullscreen { background: #020617; }

        .slide-in { animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-out { animation: slideOut 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(100px); opacity: 0; } }

        .stinger-active { animation: stingerWipe 1.2s cubic-bezier(0.77, 0, 0.175, 1) forwards; }
        @keyframes stingerWipe {
            0% { transform: translateX(-100%); }
            45% { transform: translateX(0%); }
            55% { transform: translateX(0%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body id="body-layout" class="w-[1920px] h-[1080px] relative font-sans text-white">

    <!-- === TAMPILAN 1: OVERLAY STANDARD (DEFAULT) === -->
    <div id="layout-standard" class="absolute inset-0 pointer-events-none">
        <div class="absolute top-8 left-1/2 transform -translate-x-1/2 flex flex-col items-center pointer-events-auto">
            <div id="obs_event_name" class="bg-slate-950/90 border border-slate-700 px-5 py-1 rounded-t-xl text-xs font-bold tracking-widest uppercase text-amber-400">
                EVENT BROADCAST
            </div>
            <div class="flex items-center bg-slate-900/95 border-2 border-slate-700 rounded-2xl shadow-2xl overflow-hidden backdrop-blur-md">
                <div class="flex flex-col items-end px-7 py-2.5 bg-indigo-950/90 min-w-[220px]">
                    <span class="font-extrabold text-xl tracking-wider uppercase" id="obs_home_name">HOME</span>
                    <span id="obs_home_sub" class="text-xs font-mono text-amber-300 mt-0.5">Foul: 0</span>
                </div>
                <div class="px-8 py-3 text-5xl font-black text-amber-400 bg-slate-950/90" id="obs_home_score">0</div>
                <div class="px-6 py-2 bg-slate-800 flex flex-col items-center justify-center min-w-[170px]">
                    <span class="text-[11px] font-bold text-slate-300 uppercase tracking-widest text-center" id="obs_match_name">LIVE</span>
                    <span class="text-2xl font-mono font-black text-white mt-0.5" id="obs_timer">20:00</span>
                </div>
                <div class="px-8 py-3 text-5xl font-black text-cyan-400 bg-slate-950/90" id="obs_away_score">0</div>
                <div class="flex flex-col items-start px-7 py-2.5 bg-rose-950/90 min-w-[220px]">
                    <span class="font-extrabold text-xl tracking-wider uppercase" id="obs_away_name">AWAY</span>
                    <span id="obs_away_sub" class="text-xs font-mono text-cyan-300 mt-0.5">Foul: 0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- === TAMPILAN 2: OVERLAY FULLSCREEN (JEDA / HALF-TIME) === -->
    <div id="layout-fullscreen" class="absolute inset-0 flex flex-col justify-between p-16 bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 hidden">
        <div class="text-center space-y-2">
            <h3 id="fs_event_name" class="text-xl font-bold tracking-widest text-amber-400 uppercase">EVENT BROADCAST</h3>
            <h1 id="fs_match_name" class="text-4xl font-black tracking-tight text-white uppercase">MATCH</h1>
        </div>
        <div class="grid grid-cols-7 items-center justify-center gap-6 my-auto">
            <div class="col-span-3 bg-slate-900/80 border-2 border-slate-700 p-10 rounded-3xl text-center space-y-4 shadow-2xl backdrop-blur">
                <h2 id="fs_home_name" class="text-4xl font-black text-amber-400 uppercase tracking-wide">HOME</h2>
                <div id="fs_home_score" class="text-9xl font-black text-white">0</div>
            </div>
            <div class="col-span-1 flex flex-col items-center justify-center space-y-2">
                <span class="text-3xl font-black text-slate-500 italic">VS</span>
                <div class="bg-slate-950 border border-slate-700 px-6 py-3 rounded-2xl text-center shadow-xl">
                    <span class="text-xs text-slate-400 uppercase block font-bold tracking-widest">Waktu</span>
                    <span id="fs_timer" class="text-3xl font-mono font-black text-amber-400">20:00</span>
                </div>
            </div>
            <div class="col-span-3 bg-slate-900/80 border-2 border-slate-700 p-10 rounded-3xl text-center space-y-4 shadow-2xl backdrop-blur">
                <h2 id="fs_away_name" class="text-4xl font-black text-cyan-400 uppercase tracking-wide">AWAY</h2>
                <div id="fs_away_score" class="text-9xl font-black text-white">0</div>
            </div>
        </div>
        <div class="flex justify-between items-center border-t border-slate-800 pt-6">
            <span class="text-sm font-bold text-slate-400 uppercase tracking-widest">Official Live Broadcast System</span>
            <span class="text-sm font-bold text-amber-500 animate-pulse">● LIVE STREAMING</span>
        </div>
    </div>

    <!-- ANIMASI GOAL POPUP (AKTIF DI KEDUA MODE JIKA DIAKTIFKAN) -->
    <div id="goal-popup" class="fixed inset-0 flex items-center justify-center z-40 pointer-events-none opacity-0 scale-50 transition-all duration-300">
        <div class="bg-gradient-to-r from-amber-500 via-red-600 to-amber-500 border-4 border-white px-16 py-8 rounded-3xl shadow-2xl text-center">
            <h1 class="text-7xl font-black text-white tracking-widest uppercase drop-shadow-lg animate-bounce">GOAL!</h1>
            <p id="goal-team-name" class="text-2xl font-bold text-amber-100 mt-2">TIM</p>
        </div>
    </div>

    <!-- LOWER THIRD (Hanya tampil di mode standar) -->
    <div id="lower-third-container" class="absolute bottom-20 left-14 hidden opacity-0">
        <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 border-l-8 border-amber-400 px-8 py-4 rounded-r-2xl shadow-2xl">
            <div id="obs_lt_title" class="text-3xl font-black text-white tracking-wide">Nama Peserta</div>
            <div id="obs_lt_subtitle" class="text-base font-semibold text-amber-300 mt-1">Keterangan</div>
        </div>
    </div>

    <!-- STINGER -->
    <div id="stinger-layer" class="fixed inset-0 bg-gradient-to-r from-amber-500 via-indigo-900 to-slate-950 z-50 transform -translate-x-full flex items-center justify-center pointer-events-none">
        <div id="stinger-event-title" class="text-6xl font-black tracking-widest uppercase text-white drop-shadow-lg">LIVE BROADCAST</div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzF1u3snAy1wvDnv266U-z7H_frPHB4yVhOhwBZc7lXf1Qwm6g7l5RyTw1vjIY10U70kw/exec";

        // Deteksi mode dari URL (jika ada ?mode=fullscreen)
        const urlParams = new URLSearchParams(window.location.search);
        const isFullscreen = urlParams.get('mode') === 'fullscreen';

        if (isFullscreen) {
            document.getElementById('body-layout').classList.add('mode-fullscreen');
            document.getElementById('layout-standard').classList.add('hidden');
            document.getElementById('layout-fullscreen').classList.remove('hidden');
        }

        let lastGoalTrigger = 0;
        let lastStinger = 0;
        let timerSeconds = 1200;
        let timerStatus = 'stopped';
        let timerMode = 'down';

        setInterval(() => {
            if (timerStatus === 'running') {
                if (timerMode === 'down' && timerSeconds > 0) timerSeconds--;
                else if (timerMode === 'up') timerSeconds++;
                updateTimerDisplay();
            }
        }, 1000);

        function updateTimerDisplay() {
            let mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
            let secs = String(timerSeconds % 60).padStart(2, '0');
            document.getElementById('obs_timer').innerText = `${mins}:${secs}`;
            document.getElementById('fs_timer').innerText = `${mins}:${secs}`;
        }

        function triggerGoalAnimation(teamName) {
            let popup = document.getElementById('goal-popup');
            document.getElementById('goal-team-name').innerText = teamName ? "Gol oleh " + teamName : "GOAL!";
            popup.classList.remove('opacity-0', 'scale-50');
            popup.classList.add('opacity-100', 'scale-100');
            setTimeout(() => {
                popup.classList.remove('opacity-100', 'scale-100');
                popup.classList.add('opacity-0', 'scale-50');
            }, 3500);
        }

        async function pollData() {
            try {
                let res = await fetch(API_URL + "?action=getAll");
                let data = await res.json();
                if (!data.State) return;

                let s = data.State;
                let extra = {};
                try { extra = JSON.parse(s.extra_data || "{}"); } catch(e) {}

                // Update teks untuk kedua mode
                document.getElementById('obs_event_name').innerText = s.event_name || 'LIVE EVENT';
                document.getElementById('fs_event_name').innerText = s.event_name || 'LIVE EVENT';
                document.getElementById('stinger-event-title').innerText = s.event_name || 'LIVE BROADCAST';
                
                document.getElementById('obs_match_name').innerText = s.match_name || 'LIVE';
                document.getElementById('fs_match_name').innerText = s.match_name || 'LIVE';

                document.getElementById('obs_home_name').innerText = s.home_name || 'HOME';
                document.getElementById('fs_home_name').innerText = s.home_name || 'HOME';

                document.getElementById('obs_away_name').innerText = s.away_name || 'AWAY';
                document.getElementById('fs_away_name').innerText = s.away_name || 'AWAY';

                document.getElementById('obs_home_score').innerText = s.home_score || 0;
                document.getElementById('fs_home_score').innerText = s.home_score || 0;

                document.getElementById('obs_away_score').innerText = s.away_score || 0;
                document.getElementById('fs_away_score').innerText = s.away_score || 0;

                let sport = s.sport_type || 'futsal';
                if (sport === 'futsal') {
                    document.getElementById('obs_home_sub').innerText = `Foul: ${extra.home_foul || 0}/5`;
                    document.getElementById('obs_away_sub').innerText = `Foul: ${extra.away_foul || 0}/5`;
                }

                timerMode = s.timer_mode || 'down';
                if (s.timer_status !== timerStatus) {
                    timerStatus = s.timer_status;
                    if (timerStatus === 'stopped') {
                        timerSeconds = parseInt(s.timer_seconds) || 1200;
                        updateTimerDisplay();
                    }
                }

                // Cek Animasi Goal (Hanya jika diaktifkan di panel kontrol)
                let gTrigger = parseInt(s.goal_trigger) || 0;
                let animEnabled = (s.goal_animation_enabled === "1" || s.goal_animation_enabled === 1);
                if (animEnabled && gTrigger > 0 && lastGoalTrigger !== 0 && gTrigger !== lastGoalTrigger) {
                    triggerGoalAnimation(s.last_scoring_team);
                }
                lastGoalTrigger = gTrigger;

                // Lower Third (Hanya tampil di mode standard)
                if (!isFullscreen) {
                    let ltEl = document.getElementById('lower-third-container');
                    if (parseInt(s.active_lt_show) === 1) {
                        document.getElementById('obs_lt_title').innerText = s.active_lt_title || '';
                        document.getElementById('obs_lt_subtitle').innerText = s.active_lt_subtitle || '';
                        ltEl.classList.remove('hidden', 'slide-out');
                        ltEl.classList.add('slide-in');
                    } else if (!ltEl.classList.contains('hidden')) {
                        ltEl.classList.remove('slide-in');
                        ltEl.classList.add('slide-out');
                    }
                }

                let stingerVal = parseInt(s.stinger_trigger) || 0;
                if (stingerVal > 0 && lastStinger !== 0 && stingerVal !== lastStinger) {
                    let stingerEl = document.getElementById('stinger-layer');
                    stingerEl.classList.remove('stinger-active');
                    void stingerEl.offsetWidth;
                    stingerEl.classList.add('stinger-active');
                }
                lastStinger = stingerVal;

            } catch (e) { console.error(e); }
        }

        setInterval(pollData, 1500);
        pollData();
    </script>
</body>
</html>
