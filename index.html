<!-- STANDARD MODE (TOP SCOREBOARD) -->
    <div id="layout-standard" class="absolute inset-0 pointer-events-none">
        <div class="absolute top-8 left-1/2 transform -translate-x-1/2 flex flex-col items-center pointer-events-auto">
            <div id="obs_event_name" class="bg-slate-950/90 border border-slate-700 px-5 py-1 rounded-t-xl text-xs font-bold tracking-widest uppercase text-amber-400">
                EVENT BROADCAST
            </div>
            <div class="flex items-stretch bg-slate-900/95 border-2 border-slate-700 rounded-2xl shadow-2xl overflow-hidden backdrop-blur-md">
                
                <!-- PANEL TIM + SKOR KIRI -->
                <div id="std_left_wrapper" class="relative flex items-stretch overflow-hidden">
                    <!-- Overlay Animasi GOAL Kiri -->
                    <div id="std_left_goal_fx" class="hidden absolute inset-0 z-20 flex items-center justify-center overflow-hidden shadow-inner">
                        <div class="goal-sweep-bar absolute inset-y-0 w-24 bg-white/40 blur-sm"></div>
                        <div class="relative z-10 flex items-center gap-3 px-6">
                            <span class="text-3xl font-black tracking-widest uppercase text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">⚽ GOAL!</span>
                        </div>
                    </div>

                    <div class="flex items-stretch bg-slate-900/95 min-w-[260px]">
                        <!-- Strip Warna Baju & Celana Kiri -->
                        <div class="w-4 shrink-0 flex flex-col border-r border-white/20">
                            <div id="obs_left_shirt" class="h-[60%] w-full transition-colors duration-300" style="background-color: #f59e0b;"></div>
                            <div id="obs_left_shorts" class="h-[40%] w-full border-t border-black/40 transition-colors duration-300" style="background-color: #1e293b;"></div>
                        </div>
                        <div class="flex flex-col items-end justify-center flex-1 px-5 py-2.5 text-right">
                            <span class="font-extrabold text-lg leading-tight tracking-wider uppercase" id="obs_left_name">HOME</span>
                            <span id="obs_left_sub" class="text-xs font-mono text-amber-300 mt-0.5">Foul: 0/5</span>
                        </div>
                    </div>
                    <div class="px-7 py-3 flex items-center justify-center text-5xl font-black text-amber-400 bg-slate-950/90" id="obs_left_score">0</div>
                </div>

                <!-- TENGAH: MATCH & TIMER -->
                <div class="px-5 py-2 bg-slate-800 flex flex-col items-center justify-center w-[210px] shrink-0 z-10 border-x border-slate-700">
                    <span class="text-[11px] font-bold text-slate-300 uppercase tracking-widest text-center truncate w-full" id="obs_match_name">LIVE</span>
                    <span class="text-3xl font-mono font-black text-white mt-0.5 leading-none" id="obs_timer">20:00</span>
                </div>

                <!-- PANEL SKOR + TIM KANAN -->
                <div id="std_right_wrapper" class="relative flex items-stretch overflow-hidden">
                    <!-- Overlay Animasi GOAL Kanan -->
                    <div id="std_right_goal_fx" class="hidden absolute inset-0 z-20 flex items-center justify-center overflow-hidden shadow-inner">
                        <div class="goal-sweep-bar absolute inset-y-0 w-24 bg-white/40 blur-sm"></div>
                        <div class="relative z-10 flex items-center gap-3 px-6">
                            <span class="text-3xl font-black tracking-widest uppercase text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">⚽ GOAL!</span>
                        </div>
                    </div>

                    <div class="px-7 py-3 flex items-center justify-center text-5xl font-black text-cyan-400 bg-slate-950/90" id="obs_right_score">0</div>
                    <div class="flex items-stretch bg-slate-900/95 min-w-[260px]">
                        <div class="flex flex-col items-start justify-center flex-1 px-5 py-2.5 text-left">
                            <span class="font-extrabold text-lg leading-tight tracking-wider uppercase" id="obs_right_name">AWAY</span>
                            <span id="obs_right_sub" class="text-xs font-mono text-cyan-300 mt-0.5">Foul: 0/5</span>
                        </div>
                        <!-- Strip Warna Baju & Celana Kanan -->
                        <div class="w-4 shrink-0 flex flex-col border-l border-white/20">
                            <div id="obs_right_shirt" class="h-[60%] w-full transition-colors duration-300" style="background-color: #06b6d4;"></div>
                            <div id="obs_right_shorts" class="h-[40%] w-full border-t border-black/40 transition-colors duration-300" style="background-color: #ffffff;"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
